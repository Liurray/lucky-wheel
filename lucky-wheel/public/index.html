<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大家一起抽!</title>
<style>
  :root{
    --bg:#1b1330; --card:#2a2046; --card2:#352a58; --text:#f6f1ff; --muted:#a99cc9;
    --accent:#ffcf4a; --accent2:#ff5d8f; --ok:#4ade80;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    background:radial-gradient(circle at 20% 0%,#3b2670 0,#1b1330 55%) fixed;color:var(--text);min-height:100vh}
  .hidden{display:none!important}
  button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;color:#1b1330;background:var(--accent);font-weight:700}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.ghost{background:var(--card2);color:var(--text);font-weight:500}
  input,textarea{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid #4a3d75;background:#1f1738;color:var(--text)}
  label{display:block;margin:12px 0 6px;color:var(--muted);font-size:14px}

  /* 加入畫面 */
  #join{max-width:380px;margin:12vh auto 0;padding:28px;background:var(--card);border-radius:20px;box-shadow:0 10px 40px #0006}
  #join h1{margin:0 0 4px;font-size:28px}
  #join p{margin:0 0 8px;color:var(--muted)}
  #join button{width:100%;margin-top:18px;padding:14px;font-size:17px}
  #joinErr{color:var(--accent2);min-height:20px;margin-top:10px;font-size:14px}

  /* 主畫面 */
  #game{max-width:1080px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
  @media(max-width:820px){#game{grid-template-columns:1fr}}
  .card{background:var(--card);border-radius:18px;padding:16px}
  .card h3{margin:0 0 10px;font-size:16px;color:var(--muted);font-weight:600}
  .top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .top b{color:var(--accent)}
  .wheelBox{position:relative;width:100%;max-width:520px;margin:0 auto}
  canvas{width:100%;height:auto;display:block}
  .pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;
    border-left:16px solid transparent;border-right:16px solid transparent;border-top:32px solid var(--accent2);
    filter:drop-shadow(0 3px 4px #0008);z-index:2}
  #status{text-align:center;margin:14px 0 10px;font-size:18px;min-height:28px}
  #spinBtn{display:block;width:100%;max-width:520px;margin:0 auto;padding:16px;font-size:20px;background:linear-gradient(135deg,var(--accent),#ff9d3a)}
  #spinBtn.mine:not(:disabled){animation:pulse 1.2s infinite}
  @keyframes pulse{50%{transform:scale(1.03)}}

  ul{list-style:none;margin:0;padding:0}
  #players li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;margin-bottom:6px;background:var(--card2)}
  #players li.turn{outline:2px solid var(--accent);background:#4a3a7c}
  #players li.off{opacity:.45}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
  li.off .dot{background:#777}
  .tag{margin-left:auto;font-size:12px;color:var(--muted)}
  #history{max-height:260px;overflow:auto}
  #history li{display:flex;justify-content:space-between;gap:8px;padding:7px 4px;border-bottom:1px solid #3d3163;font-size:15px}
  #history .t{color:var(--muted);font-size:12px;flex:none}
  #history .p{color:var(--accent);font-weight:700}
  .empty{color:var(--muted);font-size:14px;padding:6px 4px}
  .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .chk{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--text);font-size:14px}
  .chk input{width:auto}
  textarea{min-height:130px;resize:vertical}

  /* 結果彈窗 */
  #result{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}
  #result .box{background:var(--card);padding:32px 36px;border-radius:24px;text-align:center;max-width:420px;width:100%;
    animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
  #result .who{color:var(--muted);margin-bottom:8px}
  #result .prize{font-size:38px;font-weight:800;color:var(--accent);word-break:break-word}
  @keyframes pop{from{transform:scale(.6);opacity:0}}
  #conn{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:var(--accent2);color:#fff;padding:8px 16px;border-radius:99px;font-size:14px;z-index:20}
</style>
</head>
<body>

<div id="join">
  <h1>🎡 大家一起抽!</h1>
  <p>輸入房間代碼和你的 ID 就能加入</p>
  <label>房間代碼(同一個代碼的人在同一桌)</label>
  <input id="roomIn" maxlength="20" placeholder="例如:party">
  <label>你的 ID</label>
  <input id="nameIn" maxlength="12" placeholder="例如:小明">
  <button id="joinBtn">加入</button>
  <div id="joinErr"></div>
</div>

<div id="game" class="hidden">
  <div class="card top">
    <div>房間 <b id="roomLabel"></b> · 我是 <b id="meLabel"></b></div>
    <button class="ghost" id="shareBtn">複製邀請連結</button>
  </div>

  <div class="card">
    <div class="wheelBox">
      <div class="pointer"></div>
      <canvas id="wheel" width="600" height="600"></canvas>
    </div>
    <div id="status"></div>
    <button id="spinBtn">開始轉盤</button>
  </div>

  <div>
    <div class="card" style="margin-bottom:16px">
      <h3>玩家順序</h3>
      <ul id="players"></ul>
    </div>
    <div class="card" style="margin-bottom:16px">
      <h3>抽獎紀錄</h3>
      <ul id="history"></ul>
    </div>
    <div class="card hidden" id="hostPanel">
      <h3>主持人設定(一行一個獎項)</h3>
      <textarea id="prizeText"></textarea>
      <label class="chk"><input type="checkbox" id="removeChk"> 抽中後移除該獎項(適合數量有限的獎品)</label>
      <div class="row">
        <button id="saveBtn">儲存獎項</button>
        <button class="ghost" id="clearBtn">清空紀錄</button>
      </div>
    </div>
  </div>
</div>

<div id="result" class="hidden"><div class="box"><div class="who" id="resWho"></div><div class="prize" id="resPrize"></div></div></div>
<div id="conn" class="hidden">連線中斷,重新連線中…</div>

<script>
const $ = (id) => document.getElementById(id);
let ws, me = null, room = null, S = null, rot = 0, animating = false, wantJoin = null, lastTurn = null;

// ---------- 連線 ----------
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host);
  ws.onopen = () => {
    $('conn').classList.add('hidden');
    if (wantJoin) ws.send(JSON.stringify({ type: 'join', ...wantJoin }));
  };
  ws.onclose = () => {
    if (wantJoin) $('conn').classList.remove('hidden');
    setTimeout(connect, 1500);
  };
  ws.onmessage = (e) => handle(JSON.parse(e.data));
}
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

function handle(m) {
  if (m.type === 'error') {
    if (me) { wantJoin = null; location.reload(); return; }
    wantJoin = null;
    $('joinErr').textContent = m.message;
  } else if (m.type === 'joined') {
    me = m.name; room = m.room;
    try { localStorage.setItem('lw', JSON.stringify({ name: me, room })); } catch (e) {}
    $('join').classList.add('hidden');
    $('game').classList.remove('hidden');
    $('roomLabel').textContent = room;
    $('meLabel').textContent = me;
    history.replaceState(null, '', '?room=' + encodeURIComponent(room));
  } else if (m.type === 'state') {
    const prevN = S ? S.prizes.length : -1;
    S = m;
    if (prevN !== m.prizes.length) rot = 0;
    render();
  } else if (m.type === 'spin') {
    spinTo(m);
  }
}

// ---------- 轉盤 ----------
const cv = $('wheel'), ctx = cv.getContext('2d');
function draw() {
  const W = cv.width, c = W / 2, R = c - 12;
  ctx.clearRect(0, 0, W, W);
  const prizes = S ? S.prizes : [];
  const n = prizes.length;
  ctx.save();
  ctx.beginPath(); ctx.arc(c, c, R + 8, 0, 7); ctx.fillStyle = '#ffcf4a'; ctx.fill();
  ctx.restore();
  if (!n) {
    ctx.beginPath(); ctx.arc(c, c, R, 0, 7); ctx.fillStyle = '#3a2d63'; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 34px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('獎項已抽完', c, c + 10);
    return;
  }
  const seg = (Math.PI * 2) / n;
  const fs = Math.max(20, Math.min(36, 220 / Math.sqrt(n) / 1.6));
  for (let i = 0; i < n; i++) {
    const a0 = rot + i * seg - Math.PI / 2, a1 = a0 + seg;
    ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, R, a0, a1); ctx.closePath();
    ctx.fillStyle = 'hsl(' + ((i * 360) / n + 10) + ',70%,' + (i % 2 ? '55%' : '62%') + ')';
    ctx.fill();
    ctx.strokeStyle = '#fff6'; ctx.lineWidth = 2; ctx.stroke();
    ctx.save();
    ctx.translate(c, c); ctx.rotate(a0 + seg / 2);
    ctx.fillStyle = '#1b1330'; ctx.font = 'bold ' + fs + 'px sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    let t = prizes[i]; if (t.length > 8) t = t.slice(0, 7) + '…';
    ctx.fillText(t, R - 24, 0);
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(c, c, 34, 0, 7); ctx.fillStyle = '#1b1330'; ctx.fill();
  ctx.lineWidth = 6; ctx.strokeStyle = '#ffcf4a'; ctx.stroke();
}

function spinTo(m) {
  const n = S.prizes.length, seg = (Math.PI * 2) / n, TWO = Math.PI * 2;
  let target = -(m.index + 0.5 + m.offset) * seg;
  while (target < rot + 6 * TWO) target += TWO;
  const from = rot, dur = m.duration, t0 = performance.now();
  animating = true;
  (function frame(now) {
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 4);
    rot = from + (target - from) * e;
    draw();
    if (p < 1) requestAnimationFrame(frame);
    else {
      rot = ((target % TWO) + TWO) % TWO;
      animating = false;
      draw();
      showResult(m.player, m.prize);
      render();
    }
  })(t0);
}

let resTimer;
function showResult(who, prize) {
  $('resWho').textContent = who + ' 抽中了';
  $('resPrize').textContent = prize;
  $('result').classList.remove('hidden');
  clearTimeout(resTimer);
  resTimer = setTimeout(() => $('result').classList.add('hidden'), 3500);
}
$('result').onclick = () => $('result').classList.add('hidden');

// ---------- 畫面 ----------
function fmtTime(ts) {
  const d = new Date(ts), p = (x) => String(x).padStart(2, '0');
  return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function li(cls, build) { const e = document.createElement('li'); if (cls) e.className = cls; build(e); return e; }
function span(cls, text) { const s = document.createElement('span'); if (cls) s.className = cls; s.textContent = text; return s; }

function render() {
  if (!S) return;
  if (!animating) draw();

  // 玩家
  const pl = $('players'); pl.innerHTML = '';
  S.players.forEach((p) => {
    pl.appendChild(li((p.name === S.turn ? 'turn ' : '') + (p.online ? '' : 'off'), (e) => {
      const d = document.createElement('i'); d.className = 'dot'; e.appendChild(d);
      e.appendChild(span('', p.name + (p.name === me ? '(我)' : '')));
      const tag = p.name === S.turn ? '👉 輪到他' : p.name === S.host ? '主持人' : p.online ? '' : '離線';
      if (tag) e.appendChild(span('tag', tag));
    }));
  });

  // 紀錄
  const hs = $('history'); hs.innerHTML = '';
  if (!S.history.length) hs.appendChild(li('', (e) => e.appendChild(span('empty', '還沒有人抽,等第一位!'))));
  S.history.forEach((h) => {
    hs.appendChild(li('', (e) => {
      const l = document.createElement('span');
      l.append(h.player + ' → ');
      l.appendChild(span('p', h.prize));
      e.appendChild(l);
      e.appendChild(span('t', fmtTime(h.time)));
    }));
  });

  // 狀態 & 按鈕
  const myTurn = S.turn === me, btn = $('spinBtn');
  btn.classList.toggle('mine', myTurn);
  if (!S.prizes.length) {
    $('status').textContent = '獎項都抽完了 🎉';
    btn.disabled = true; btn.textContent = '沒有獎項了';
  } else if (S.spinning) {
    $('status').textContent = '轉轉轉…';
    btn.disabled = true; btn.textContent = '轉盤轉動中';
  } else if (myTurn) {
    $('status').textContent = '輪到你了!';
    btn.disabled = false; btn.textContent = '🎯 開始轉盤';
  } else {
    $('status').textContent = S.turn ? '等待 ' + S.turn + ' 轉盤…' : '';
    btn.disabled = true; btn.textContent = '還沒輪到你';
  }
  if (myTurn && !S.spinning && lastTurn !== me) {
    document.title = '👉 輪到你了!';
    if (navigator.vibrate) navigator.vibrate(200);
  } else if (!myTurn) document.title = '大家一起抽!';
  lastTurn = S.turn;

  // 主持人面板
  const isHost = S.host === me;
  $('hostPanel').classList.toggle('hidden', !isHost);
  if (isHost && document.activeElement !== $('prizeText')) $('prizeText').value = S.prizes.join('\n');
  if (isHost) { $('removeChk').checked = S.removeOnWin; $('saveBtn').disabled = S.spinning; $('clearBtn').disabled = S.spinning; }
}

// ---------- 事件 ----------
$('spinBtn').onclick = () => { $('spinBtn').disabled = true; send({ type: 'spin' }); };
$('saveBtn').onclick = () => {
  send({ type: 'settings', prizes: $('prizeText').value.split('\n'), removeOnWin: $('removeChk').checked });
  $('prizeText').blur();
};
$('clearBtn').onclick = () => { if (confirm('確定要清空所有抽獎紀錄嗎?')) send({ type: 'clearHistory' }); };
$('shareBtn').onclick = async () => {
  const url = location.origin + '/?room=' + encodeURIComponent(room);
  try { await navigator.clipboard.writeText(url); $('shareBtn').textContent = '已複製 ✓'; }
  catch (e) { prompt('複製這個連結分享給朋友:', url); }
  setTimeout(() => ($('shareBtn').textContent = '複製邀請連結'), 1500);
};
function doJoin() {
  const name = $('nameIn').value.trim(), r = $('roomIn').value.trim();
  if (!name || !r) { $('joinErr').textContent = '請填寫房間代碼與 ID'; return; }
  $('joinErr').textContent = '';
  wantJoin = { name, room: r };
  send({ type: 'join', ...wantJoin });
}
$('joinBtn').onclick = doJoin;
[$('nameIn'), $('roomIn')].forEach((el) => el.addEventListener('keydown', (e) => { if (e.key === 'Enter') doJoin(); }));

// 預設值:網址 ?room= 優先,否則上次使用的
(function init() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('lw') || '{}'); } catch (e) {}
  const q = new URLSearchParams(location.search).get('room');
  $('roomIn').value = q || saved.room || '';
  $('nameIn').value = saved.name || '';
  connect();
  draw();
})();
</script>
</body>
</html>
